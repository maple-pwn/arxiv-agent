name: Daily arXiv Digest

on:
  schedule:
    # UTC 02:30，arXiv 每日约 01:00 UTC 前完成当日发布
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '翻译论文数量上限（测试可填 5，留空=全部翻译）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline (fetch + translate + filter + build)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python -m arxiv_daily.cli run --limit "${{ github.event.inputs.limit }}"
          else
            python -m arxiv_daily.cli run
          fi

      - name: Commit and push generated site
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily digest"
          file_pattern: "data/** docs/**"
