name: Daily arXiv Digest

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00（arXiv 每日 00:00~01:00 UTC 发布，此时间点全年都发布完毕）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '翻译论文数量上限（测试可填 5，留空=全部翻译）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline (fetch + translate + filter + build)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python -m arxiv_daily.cli run --limit "${{ github.event.inputs.limit }}"
          else
            python -m arxiv_daily.cli run
          fi

      - name: Commit and push generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: daily digest"
          git pull --rebase origin main
          git push origin main
