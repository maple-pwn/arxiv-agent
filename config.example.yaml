# arXiv 每日论文阅读站 —— 配置文件
# 复制本文件为 config.yaml 后按需修改。API key 放环境变量（见 llm.api_key_env），
# 不要写进 yaml。

categories:                        # 抓取的 arXiv 分类及中文名（侧边栏/分组标题）
  cs.AI: 人工智能
  cs.LG: 机器学习
  cs.NE: 神经与进化计算
  cs.CL: 计算语言学
  cs.MA: 多智能体系统
  cs.SE: 软件工程
  cs.OS: 操作系统
  cs.AR: 硬件架构
  cs.CR: 密码学与安全

keywords:                          # 关键词精选：命中标题或摘要的论文会被置顶高亮
  - keyword: "diffusion"
    reason: "扩散模型相关"
  - keyword: "large language model"
    reason: "大语言模型相关"

llm:                                # 翻译用的 LLM（OpenAI 兼容接口）
  provider: deepseek                # 仅作标识，不影响请求
  base_url: https://api.deepseek.com
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY     # API key 从该环境变量读取
  timeout: 120                      # 单次请求超时（秒）
  max_retries: 3                    # 失败重试次数

site:
  title: arXiv Papers
  subtitle: Daily Research Digest
  base_url: ""                      # 部署在 GitHub Pages 子路径时填 "/repo名"，根域名留空
  timezone: Asia/Shanghai           # 仅用于「今天」的默认日期；归档日期按 arXiv 发布日（UTC）自动判定

analytics: ""                       # 可选：Cloudflare Web Analytics / GoatCounter 的 script 标签，留空则隐藏访问统计块
