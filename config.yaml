# arXiv 每日论文阅读站 —— 配置文件

categories:                        # 抓取的 arXiv 分类及中文名（侧边栏/分组标题）
  cs.AI: 人工智能
  cs.LG: 机器学习
  cs.NE: 神经与进化计算
  cs.CL: 计算语言学
  cs.MA: 多智能体系统
  cs.SE: 软件工程
  cs.OS: 操作系统
  cs.AR: 硬件架构
  cs.CR: 密码学与安全

keywords:                          # 关键词精选：命中标题或摘要的论文会被置顶高亮
  - keyword: "diffusion"
    reason: "扩散模型相关"
  - keyword: "large language model"
    reason: "大语言模型相关"

llm:                                # 翻译用的 LLM（OpenAI 兼容接口）
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash
  api_key_env: DEEPSEEK_API_KEY
  timeout: 120
  max_retries: 3
  concurrency: 8                     # 并发翻译线程数

translate:
  only_favorites: true               # 只翻译精选论文（关键词命中的），降低翻译成本

site:
  title: arXiv Papers
  subtitle: Daily Research Digest
  base_url: ""
  timezone: UTC

analytics: ""
